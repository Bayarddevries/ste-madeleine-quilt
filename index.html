<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ste. Madeleine — A Quilt of Memory &amp; Reclamation</title>
<link rel="stylesheet" href="assets/css/quilt.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); }
  /* Free-pan canvas */
  #viewport {
    position: fixed; inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 30%, #241a10 0%, #171008 60%, #120c06 100%),
      var(--bg);
    cursor: grab;
    touch-action: none;
  }
  #viewport.panning { cursor: grabbing; }
  #surface {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #load-msg {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-family: var(--font-sans); letter-spacing: .05em; z-index: 5;
  }
  /* intro overlay */
  #intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px;
    background: radial-gradient(ellipse at 50% 30%, #2c1f12 0%, #120c06 80%);
    transition: opacity .5s ease;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro .wordmark { max-width: min(420px, 80vw); margin-bottom: 20px; }
  #intro h1 {
    font-family: var(--font-sans);
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
  }
  #intro p { max-width: 480px; margin-top: 14px; color: var(--ink-dim); font-size: 1.02rem; line-height: 1.6; }
  #intro .enter-btn {
    margin-top: 30px; padding: 12px 34px;
    background: var(--crimson); color: #fff; border: none; border-radius: 30px;
    font-family: var(--font-sans); font-size: 15px; letter-spacing: .06em; cursor: pointer;
  }
  #intro .enter-btn:hover { background: #c04a52; }
  #intro .hint { margin-top: 16px; color: var(--ink-dim); font-size: 13px; }
  #load-msg.hidden { display: none; }
</style>
</head>
<body>
  <!-- Intro overlay -->
  <div id="intro">
    <img class="wordmark" src="media/ste-madeleine-sign-wordmark.png" alt="Ste. Madeleine">
    <h1>A Quilt of Memory &amp; Reclamation</h1>
    <p>
      The story of a Métis community taken by force, remembered through the land,
      and reclaimed by the people who returned. Drag in any direction to walk the quilt.
    </p>
    <button class="enter-btn" id="enter-btn">Enter the Quilt</button>
    <div class="hint">drag to move · scroll / pinch to zoom</div>
  </div>

  <div id="load-msg">Loading the quilt…</div>

  <!-- Free-pan canvas -->
  <div id="viewport">
    <div id="surface"></div>
  </div>

  <!-- Shared audio player -->
  <div id="q-audio-player"><span class="q-audio-label"></span><audio controls></audio></div>

  <script src="assets/js/renderer.js"></script>
  <script src="assets/js/viewer.js"></script>
</body>
</html>
