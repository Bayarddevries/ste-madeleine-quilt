<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ste. Madeleine's Quilt</title>
<style>
  @font-face{
    font-family:'BarlowCondensed';
    src:url('media/barlow-condensed-regular.ttf') format('truetype');
    font-weight:normal; font-display:swap;
  }
  :root{
    --crimson:#b3362a;
    --parchment:#f4ecd8;
    --ink:#2b1f16;
    --teal:#1f5c5b;
    --gold:#c9a227;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#efe6d0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);}
  body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;}

  /* ---- the quilt plane ---- */
  #stage{position:absolute;inset:0;overflow:hidden;cursor:grab;background:
    radial-gradient(circle at 20% 30%, rgba(201,162,39,.10), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(31,92,91,.12), transparent 45%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 2px, transparent 2px 48px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 48px);
    }
  #stage.dragging{cursor:grabbing;}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}

  /* ---- tiles ---- */
  .tile{position:absolute;will-change:transform;border-radius:6px;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.14);
    border:3px solid #fff;background:#fff;cursor:pointer;}
  .tile .label{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;
    background:linear-gradient(transparent, rgba(20,14,8,.78));color:#f6efe0;
    font-family:'BarlowCondensed',Georgia,serif;font-size:14px;font-weight:normal;letter-spacing:.6px;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .tile video,.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .tile model-viewer{width:100%;height:100%;--poster-color:transparent;pointer-events:none;}
  #overlay .media model-viewer{width:100%;height:56vh;background:#1a120b;border-radius:10px 10px 0 0;}
  .tile.type-photo{background:linear-gradient(135deg,#8b6f47,#5f4a2e);}
  .tile.type-video{background:linear-gradient(135deg,#1f5c5b,#123b3a);}
  .tile.type-audio{background:linear-gradient(135deg,#5b4a8a,#3d3263);}
  .tile.type-sphere{background:linear-gradient(135deg,#3a6ea5,#23496e);}
  .tile.type-scrap{background:linear-gradient(135deg,#a3358a,#6e205c);}
  .tile .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:#fff;gap:6px;}
  .tile .ph .em{font-size:34px;line-height:1;}
  .tile .ph .tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.9;}
  .tile .badge{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(0,0,0,.45);color:#fff;}
  .tile .dur{position:absolute;top:6px;right:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.5);
    padding:2px 5px;border-radius:4px;}
  .tile .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;
    border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;padding-left:3px;}

  /* ---- HUD ---- */
  #hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;
    display:flex;align-items:center;gap:10px;pointer-events:none;z-index:30;
    background:linear-gradient(rgba(43,31,22,.55), transparent);}
  #hud h1{color:#f7efe0;font-size:16px;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);flex:1;display:flex;flex-direction:column;min-width:0;}
  #hud h1 .brand{height:clamp(40px,7vw,64px);width:auto;max-width:min(56vw,460px);object-fit:contain;align-self:flex-start;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
  #hud h1 small{display:block;font-weight:normal;font-size:10.5px;opacity:.85;letter-spacing:1px;}
  #hud .btn{pointer-events:auto;background:rgba(43,31,22,.72);color:#f7efe0;border:none;border-radius:20px;
    padding:7px 12px;font-family:inherit;font-size:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4);}
  #hud .btn:active{background:var(--crimson);}
  #zoomval{pointer-events:auto;background:rgba(43,31,22,.5);color:#e8dcc0;border:none;border-radius:12px;
    padding:3px 8px;font-size:11px;}

  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:0;right:0;text-align:center;
    color:rgba(43,31,22,.7);font-size:12px;pointer-events:none;z-index:30;text-shadow:0 1px 2px rgba(255,255,255,.5);}

  /* ---- detail overlay ---- */
  #overlay{position:fixed;inset:0;z-index:50;background:rgba(20,14,8,.86);display:none;
    align-items:center;justify-content:center;flex-direction:column;padding:20px;}
  #overlay.open{display:flex;}
  #overlay .card{background:var(--parchment);border-radius:10px;max-width:92vw;max-height:82vh;overflow:auto;
    box-shadow:0 10px 40px rgba(0,0,0,.5);}
  #overlay .media{max-width:92vw;max-height:56vh;object-fit:contain;border-radius:10px 10px 0 0;display:block;width:100%;background:#000;}
  #overlay .meta{padding:14px 16px 16px;}
  #overlay .meta .type{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--crimson);font-weight:bold;}
  #overlay .meta h2{font-size:19px;margin:4px 0 6px;}
  #overlay .meta p{font-size:13.5px;line-height:1.45;color:#4a3a2c;}
  #overlay .meta audio{width:100%;margin-top:10px;}
  #close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;width:38px;height:38px;
    border-radius:50%;background:rgba(244,236,216,.95);border:none;font-size:20px;color:var(--ink);
    cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:60;line-height:1;}
</style>
</head>
<body>

<div id="stage">
  <div id="world"></div>
</div>

<div id="hud">
  <h1><img class="brand" src="media/ste-madeleine-title.png" alt="Ste Madeleine's Quilt"><small>MEMORIES · Aug 21–23</small></h1>
  <span id="zoomval">100%</span>
  <button id="viewall" class="btn">◉ view all</button>
  <button id="edit" class="btn" title="Open the layout editor">✎ edit layout</button>
</div>
<div id="hint">drag to wander · pinch to zoom · tap a tile ★</div>

<div id="overlay">
  <button id="close" aria-label="close">✕</button>
  <div class="card">
    <div class="media" id="ov-media"></div>
    <div class="meta">
      <div class="type" id="ov-type"></div>
      <h2 id="ov-title"></h2>
      <p id="ov-cap"></p>
      <div id="ov-audio"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ world & camera ============ */
const WORLD = { w: 4000, h: 4000 };
const cam  = { x: 2000, y: 2000, zoom: 1 };
const MINZ = 0.35, MAXZ = 3.0;
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const zoomval = document.getElementById('zoomval');

/* ============ tile data (prototype) ============
   type: photo | video | audio | sphere | scrap
   x,y  : world coordinate of tile CENTER
   s    : side length (square for now)                        */
let TILES = [
  { id:'v1', type:'video', x:820,  y:700,  s:340, title:'Métis flag · Ste. Mads',
    src:'media/flag-loop.mp4', dur:'0:05',
    cap:'The Métis flag flying over Ste. Madeleine on a clear summer morning. Seamless loop.' },
  { id:'p1', type:'photo', x:1260, y:560,  s:260, title:'The tent & table',
    cap:'Community art table at the CCAP workshop. Placeholder — swap in a real photo.' },
  { id:'p2', type:'photo', x:1600, y:820,  s:280, title:'Shoebox kiosk',
    cap:'Bayard running the Shoebox digitizing table. Placeholder.' },
  { id:'p3', type:'photo', x:2100, y:600,  s:240, title:'Elders gathering',
    cap:'Elders sharing stories under the tent. Placeholder.' },
  { id:'f1', type:'gif', x:640,  y:1100, s:250, title:'Métis flag · waving',
    src:'media/flag-wave.gif',
    cap:'The Métis flag, sequential frames played as a loop.' },
  { id:'f2', type:'gif', x:1980, y:1180, s:300, title:'Métis flag · full sky',
    src:'media/flag-wave2.gif',
    cap:'The Métis flag across the sky, sequential frames in motion.' },
  { id:'f3', type:'gif', x:2780, y:900, s:240, title:'Métis flag · portrait',
    src:'media/flag-wave3.gif',
    cap:'Portrait view of the Métis flag, sequential frames in motion.' },
  { id:'wm', type:'photo', x:2400, y:560, w:560, h:80, title:'The sign · Ste Madeleine',
    src:'media/ste-madeleine-title.png',
    cap:'The entrance sign to Ste. Madeleine, traced from the original, with the quilt\'s title. White letters on the sign\'s dark metal.' },
  { id:'sc1', type:'scrap', x:2400, y:900, s:260, title:'Scrapbook page',
    cap:'A scrapbook page from the workshop. Placeholder scan.' },
  { id:'a1', type:'audio', x:2820, y:660,  s:200, title:'Oral history clip',
    src:null, cap:'An audio snippet from the oral-history tent. Placeholder — drop an audio file.' },
  { id:'sp1', type:'sphere', x:3180, y:940, s:260, title:'360° — inside the tent',
    cap:'Photosphere of the tent interior. Viewer to be wired in. Placeholder.' },
  { id:'p4', type:'photo', x:980,  y:1250, s:240, title:'Michif bingo',
    cap:'Michif bingo session, Saturday morning. Placeholder.' },
  { id:'p5', type:'photo', x:1500, y:1400, s:270, title:'Finger sash weaving',
    cap:'Finger sash-weaving workshop. Placeholder.' },
  { id:'a2', type:'audio', x:2050, y:1350, s:190, title:'Fiddler & ambient',
    src:null, cap:'Ambient audio of the music stage. Placeholder.' },
  { id:'sc2', type:'scrap', x:2500, y:1300, s:230, title:'Kids’ art',
    cap:'Kids’ drawings from the children’s activity. Placeholder.' },
  { id:'sp2', type:'sphere', x:2900, y:1500, s:240, title:'360° — the site',
    cap:'Photosphere looking out over the historic site. Placeholder.' },
  { id:'p6', type:'photo', x:700,  y:1750, s:250, title:'Family photos shared',
    cap:'Photos the community shared at the tent. Placeholder.' },
  { id:'v2', type:'video', x:1300, y:1800, s:260, title:'Community clip',
    src:null, dur:'–', cap:'A short video someone shared. Placeholder — drop a clip.' },
];

const EMOJI = { photo:'📷', video:'🎞️', audio:'🎙️', sphere:'🌐', scrap:'📓', gif:'🎞️' };
const BADGE = { photo:'📷', video:'▶', audio:'♪', sphere:'🌐', scrap:'📓', gif:'▶' };

/* lazy-load the model-viewer library once, only when a 3D tile is opened */
let _mvPromise=null;
function loadModelViewer(){
  if(customElements.get('model-viewer')) return Promise.resolve();
  if(_mvPromise) return _mvPromise;
  _mvPromise = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.type='module';
    s.src='media/vendor/model-viewer.min.js';
    s.onload=resolve;
    s.onerror=()=>{ _mvPromise=null; reject(new Error('model-viewer failed to load')); };
    document.head.appendChild(s);
  });
  return _mvPromise;
}

/* build tile DOM */
const tileEls = new Map();
function renderTiles(){
  world.innerHTML='';
  tileEls.clear();
  TILES.forEach(t=>{
  const el = document.createElement('div');
  el.className = 'tile type-'+t.type;
  const tw = t.w || t.s, th = t.h || t.s;
  el.style.width = tw+'px'; el.style.height = th+'px';
  const badge = document.createElement('div'); badge.className='badge'; badge.textContent = BADGE[t.type];
  el.appendChild(badge);
  if(t.type==='video' && t.src){
    const v = document.createElement('video'); v.src=t.src; v.muted=true; v.loop=true; v.playsInline=true; v.preload='metadata';
    el.appendChild(v);
    const d = document.createElement('div'); d.className='dur'; d.textContent=t.dur||''; el.appendChild(d);
    const play = document.createElement('div'); play.className='play'; play.textContent='▶'; el.appendChild(play);
  } else if(t.type==='sphere' && t.src && /\.(glb|gltf)$/i.test(t.src)){
    // lightweight tile preview: icon + label; full 3D viewer loads in the overlay on tap
    const ph = document.createElement('div'); ph.className='ph';
    const e = document.createElement('div'); e.className='em'; e.textContent='🧊';
    const tag = document.createElement('div'); tag.className='tag'; tag.textContent='3D';
    ph.appendChild(e); ph.appendChild(tag); el.appendChild(ph);
  } else if((t.type==='gif'||t.type==='photo'||t.type==='scrap') && t.src){
    const g = document.createElement('img'); g.src=t.src; g.alt=t.title; g.loading='lazy';
    g.style.objectFit='contain';
    el.appendChild(g);
  } else {
    const ph = document.createElement('div'); ph.className='ph';
    const e = document.createElement('div'); e.className='em'; e.textContent=EMOJI[t.type];
    const tag = document.createElement('div'); tag.className='tag'; tag.textContent=t.type;
    ph.appendChild(e); ph.appendChild(tag); el.appendChild(ph);
    if(t.type==='video'){ const d=document.createElement('div'); d.className='dur'; d.textContent=t.dur||''; el.appendChild(d); }
  }
  const lb = document.createElement('div'); lb.className='label'; lb.textContent=t.title;
  el.appendChild(lb);
  el.addEventListener('pointerdown', e=>e.stopPropagation());
  el.addEventListener('click', e=>{ e.stopPropagation(); openTile(t); });
  world.appendChild(el);
  tileEls.set(t.id, el);
  });
}

/* ============ torus math ============
   For each tile, pick the representative position nearest the camera
   (mod WORLD). Since the viewport is always far smaller than the world,
   each tile needs exactly one copy — no duplication, seamless wrap.  */
function nearestCoord(p, camP, size){
  let d = ((p - camP) % size + size) % size;
  if (d > size/2) d -= size;
  return camP + d;
}
function layout(){
  const ox = -cam.x, oy = -cam.y;
  world.style.transform = 'scale('+cam.zoom+') translate3d('+ox+'px,'+oy+'px,0)';
  const vw = window.innerWidth/cam.zoom, vh = window.innerHeight/cam.zoom;
  for(const t of TILES){
    const el = tileEls.get(t.id);
    const tw = t.w || t.s, th = t.h || t.s;
    const x = nearestCoord(t.x, cam.x, WORLD.w) - tw/2;
    const y = nearestCoord(t.y, cam.y, WORLD.h) - th/2;
    el.style.left = x+'px'; el.style.top = y+'px';
    // cull off-screen
    const off = x > cam.x+vw+60 || x+tw < cam.x-60 || y > cam.y+vh+60 || y+th < cam.y-60;
    el.style.display = off ? 'none' : '';
    // pause video if scrolled out of view
    if(t.type==='video'){
      const v = el.querySelector('video');
      if(v && off && !v.paused) v.pause();
    }
  }
  zoomval.textContent = Math.round(cam.zoom*100)+'%';
}

function step(dx, dy){
  cam.x = ((cam.x + dx) % WORLD.w + WORLD.w) % WORLD.w;
  cam.y = ((cam.y + dy) % WORLD.h + WORLD.h) % WORLD.h;
  layout();
}

/* ============ drag / pan ============ */
let dragging=false, lastX=0, lastY=0, pinchD=0, pinchCX=0, pinchCY=0, pinchZ=0;
stage.addEventListener('pointerdown', e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;
  dragging=true; stage.classList.add('dragging');
  lastX=e.clientX; lastY=e.clientY;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  step(-dx/cam.zoom, -dy/cam.zoom);
});
function endDrag(){ dragging=false; stage.classList.remove('dragging'); }
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* zoom to an ABSOLUTE target zoom around a screen point (sx,sy) */
function zoomToAt(z, sx, sy){
  const wx = cam.x + sx/cam.zoom, wy = cam.y + sy/cam.zoom;
  cam.zoom = z;
  cam.x = wx - sx/z;
  cam.y = wy - sy/z;
  cam.x = ((cam.x % WORLD.w)+WORLD.w)%WORLD.w;
  cam.y = ((cam.y % WORLD.h)+WORLD.h)%WORLD.h;
  layout();
}
function zoomAt(factor, sx, sy){
  zoomToAt(Math.min(MAXZ, Math.max(MINZ, cam.zoom*factor)), sx, sy);
}
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAt(Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY);
},{passive:false});
stage.addEventListener('dblclick', e=>{ zoomAt(1.6, e.clientX, e.clientY); });

/* pinch zoom */
let pointers = new Map();
stage.addEventListener('pointerdown', e=>{ pointers.set(e.pointerId, {x:e.clientX,y:e.clientY}); if(pointers.size===2){ pinchD=dist(pointers); const [a,b]=[...pointers.values()]; pinchCX=(a.x+b.x)/2; pinchCY=(a.y+b.y)/2; pinchZ=cam.zoom; } });
stage.addEventListener('pointermove', e=>{ if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pointers.size===2){ const d=dist(pointers); zoomToAt(Math.min(MAXZ,Math.max(MINZ, pinchZ*(d/pinchD))), pinchCX, pinchCY); } });
stage.addEventListener('pointerup', e=>{ pointers.delete(e.pointerId); });
function dist(m){ const [a,b]=[...m.values()]; return Math.hypot(a.x-b.x, a.y-b.y)||0; }

/* frame the whole quilt (used at boot and "view all") */
function frameContent(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const t of TILES){
    const tw = t.w || t.s, th = t.h || t.s;
    minX=Math.min(minX,t.x-tw/2); maxX=Math.max(maxX,t.x+tw/2);
    minY=Math.min(minY,t.y-th/2); maxY=Math.max(maxY,t.y+th/2);
  }
  const pad=320;
  const w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2;
  cam.zoom=Math.min(1, Math.max(MINZ, Math.min(window.innerWidth/w, window.innerHeight/h)));
  const vw=window.innerWidth/cam.zoom, vh=window.innerHeight/cam.zoom;
  cam.x=((minX+maxX)/2 - vw/2); cam.y=((minY+maxY)/2 - vh/2);
  cam.x=((cam.x%WORLD.w)+WORLD.w)%WORLD.w;
  cam.y=((cam.y%WORLD.h)+WORLD.h)%WORLD.h;
  layout();
}

/* ============ view all ============ */
document.getElementById('viewall').addEventListener('click', frameContent);
document.getElementById('edit').addEventListener('click', ()=>{
  // pass a compact copy of the tiles to the editor via URL
  const slim = TILES.map(t=>({id:t.id,type:t.type,x:Math.round(t.x),y:Math.round(t.y),
    w:Math.round(t.w||t.s),h:Math.round(t.h||t.s),src:t.src||null,title:t.title,cap:t.cap,dur:t.dur}));
  const q = '?tiles='+encodeURIComponent(JSON.stringify(slim));
  window.open('editor.html'+q, '_blank');
});

/* ============ detail overlay ============ */
const overlay = document.getElementById('overlay');
const ovMedia = document.getElementById('ov-media');
const ovType  = document.getElementById('ov-type');
const ovTitle = document.getElementById('ov-title');
const ovCap   = document.getElementById('ov-cap');
const ovAudio = document.getElementById('ov-audio');
const closeBtn= document.getElementById('close');
function openTile(t){
  ovMedia.innerHTML=''; ovAudio.innerHTML='';
  ovType.textContent = t.type;
  ovTitle.textContent = t.title;
  ovCap.textContent = t.cap || '';
  if(t.type==='video' && t.src){
    const v=document.createElement('video'); v.src=t.src; v.controls=true; v.autoplay=true; v.loop=true; v.playsInline=true;
    ovMedia.appendChild(v); ovMedia.classList.add('media');
  } else if(t.type==='gif' && t.src){
    ovMedia.innerHTML=''; ovMedia.className='media';
    const g=document.createElement('img'); g.src=t.src; g.alt=t.title; g.style.maxHeight='56vh'; g.style.width='auto'; g.style.objectFit='contain';
    ovMedia.appendChild(g);
  } else if(t.type==='photo' || t.type==='scrap'){
    ovMedia.innerHTML=''; ovMedia.className='media';
    if(t.src){
      const g=document.createElement('img'); g.src=t.src; g.alt=t.title; g.style.maxHeight='56vh'; g.style.width='auto'; g.style.objectFit='contain'; g.style.margin='0 auto';
      ovMedia.appendChild(g);
    } else {
      const ph=document.createElement('div'); ph.style.cssText='display:flex;align-items:center;justify-content:center;height:240px;color:#fff;font-size:64px;'; ph.textContent=EMOJI[t.type];
      ovMedia.appendChild(ph);
    }
  } else if(t.type==='sphere'){
    ovMedia.innerHTML=''; ovMedia.className='media';
    if(t.src && /\.(glb|gltf)$/i.test(t.src)){
      // lazy-load model-viewer only when a 3D tile is actually opened
      loadModelViewer().then(()=>{
        const mv=document.createElement('model-viewer');
        mv.src=t.src; mv.alt=t.title||'3D scan';
        mv.setAttribute('auto-rotate',''); mv.setAttribute('camera-controls','');
        mv.setAttribute('interaction-prompt','');
        mv.setAttribute('shadow-intensity','1');
        mv.style.width='100%'; mv.style.height='56vh';
        ovMedia.innerHTML=''; ovMedia.appendChild(mv);
      });
      const ph=document.createElement('div'); ph.style.cssText='display:flex;align-items:center;justify-content:center;height:240px;color:#fff;font-size:56px;'; ph.textContent='⏳';
      ovMedia.appendChild(ph);
    } else {
      const ph=document.createElement('div'); ph.style.cssText='display:flex;align-items:center;justify-content:center;height:240px;color:#fff;font-size:56px;'; ph.textContent='🌐';
      ovMedia.appendChild(ph);
    }
  } else if(t.type==='audio'){
    ovMedia.innerHTML=''; ovMedia.className='media';
    const ph=document.createElement('div'); ph.style.cssText='display:flex;align-items:center;justify-content:center;height:180px;color:#fff;font-size:64px;'; ph.textContent='🎙️';
    ovMedia.appendChild(ph);
    if(t.src){ const a=document.createElement('audio'); a.src=t.src; a.controls=true; ovAudio.appendChild(a); }
    else { const note=document.createElement('p'); note.textContent='(drop an audio file to hear this)'; ovAudio.appendChild(note); }
  }
  overlay.classList.add('open');
}
closeBtn.addEventListener('click', ()=>{ overlay.classList.remove('open'); const v=ovMedia.querySelector('video'); if(v) v.pause(); });
overlay.addEventListener('click', e=>{ if(e.target===overlay){ overlay.classList.remove('open'); } });

/* ============ boot ============ */
function resize(){ layout(); }
window.addEventListener('resize', resize);

// Load weekend media tiles from quilt-tiles.json (if present), then render.
async function boot(){
  try{
    const r = await fetch('quilt-tiles.json');
    if(r.ok){
      const extra = await r.json();
      const existing = new Set(TILES.map(t=>t.id));
      const fresh = extra.filter(t=>!existing.has(t.id));
      if(fresh.length) TILES = TILES.concat(fresh);
    }
  }catch(e){ /* keep embedded prototype */ }
  renderTiles();
  frameContent();
}
boot();
})();
</script>
