<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ste. Madeleine — A Quilt of Memory &amp; Reclamation</title>
<link rel="stylesheet" href="assets/css/quilt.css">
<style>
  /* Viewer-specific chrome */
  .quilt-hero {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px;
    background: radial-gradient(ellipse at 50% 30%, #2c1f12 0%, var(--bg) 70%);
  }
  .quilt-hero .wordmark {
    max-width: min(640px, 90vw);
    margin-bottom: 22px;
  }
  .quilt-hero h1 {
    font-family: var(--font-sans);
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .quilt-hero .sub {
    margin-top: 14px;
    max-width: 520px;
    color: var(--ink-dim);
    font-size: 1.05rem;
    line-height: 1.6;
  }
  .quilt-hero .scroll-cue {
    margin-top: 34px;
    color: var(--accent);
    font-size: 26px;
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }
</style>
</head>
<body>
  <div class="quilt-hero">
    <img class="wordmark" src="media/ste-madeleine-sign-wordmark.png" alt="Ste. Madeleine">
    <h1>A Quilt of Memory &amp; Reclamation</h1>
    <p class="sub">
      The story of a Métis community taken by force, remembered through the land,
      and reclaimed by the people who returned. Scroll to walk the quilt.
    </p>
    <div class="scroll-cue">&#8964;</div>
  </div>

  <main class="quilt-scroll" id="scroll"></main>

  <footer class="quilt-footer" style="padding:60px 24px;text-align:center;color:var(--ink-dim);font-family:var(--font-sans);letter-spacing:.05em;">
    Ste. Madeleine Métis Days 2026 · RRMNHC · Lii Michif Niiyanaan
  </footer>

  <!-- Shared audio player -->
  <div id="q-audio-player">
    <span class="q-audio-label"></span>
    <audio controls></audio>
  </div>

  <!-- Vendored local 3D viewer (free, no CDN) -->
  <script src="media/vendor/model-viewer.min.js" type="module"></script>
  <script src="assets/js/renderer.js"></script>
  <script src="assets/js/viewer.js"></script>
</body>
</html>
