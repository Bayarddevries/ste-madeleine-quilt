<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif',Georgia,serif;color:#2b1e10;background:#3e2714;width:1569px;min-height:11000px;position:relative;overflow-x:hidden}
.bg{position:fixed;top:0;left:0;width:1569px;height:11000px;background:url('media/raw/woodgrain-crop.jpg') repeat-y center top;background-size:1440px auto;opacity:0.92;z-index:0;pointer-events:none}

.card{position:absolute;width:680px;height:320px;z-index:2}
.card-img{position:absolute;left:0;top:0;width:680px;height:320px;object-fit:cover;opacity:0.88;border:1px solid #8a6340}
.img{position:absolute;z-index:2;border:1px solid #6e4f2b}
.text-img{position:absolute;z-index:3;opacity:0.97}
.banner{position:absolute;z-index:4;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;color:#f4e3c8}
.credits{position:absolute;z-index:4;font-family:'Noto Serif',serif;color:#efe0c0;line-height:1.4}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
