<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ste Madeleine — Quilt Layout Designer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,serif;background:#1a120b;color:#e8dcc0;overflow:hidden}
#toolbar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:12px;
  padding:0 16px;background:rgba(26,18,11,.95);border-bottom:1px solid #3a2d1e;z-index:100;font-size:14px}
#toolbar button{background:#2a1e12;border:1px solid #4a3a26;color:#e8dcc0;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit}
#toolbar button:hover{background:#3a2a18}
#toolbar button.primary{background:#b3362a;border-color:#b3362a;color:#fff}
#toolbar button.primary:hover{background:#c04a52}
#toolbar .spacer{flex:1}
#toolbar .badge{background:#c9a227;color:#1a120b;padding:2px 10px;border-radius:16px;font-size:12px;font-weight:bold}
#canvas-container{position:fixed;inset:60px 0 40px;overflow:hidden;cursor:grab}
#canvas-container.dragging{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;background:#000}
.controls{position:fixed;bottom:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;z-index:50}
.controls button{background:rgba(255,255,255,.1);border:1px solid #4a3a26;color:#e8dcc0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.controls input[type=range]{width:150px}
#media-panel{position:fixed;top:60px;right:-320px;width:300px;height:calc(100vh-60px);
  background:rgba(26,18,11,.95);border-left:1px solid #3a2d1e;overflow-y:auto;z-index:90;
  transition:right .3s ease;padding:12px}
#media-panel.open{right:0}
#media-panel h3{font-size:14px;margin-bottom:12px;color:#c9a227}
.media-thumb{width:100%;height:80px;object-fit:cover;border-radius:4px;margin-bottom:6px;
  cursor:pointer;border:2px solid transparent}
.media-thumb.selected{border-color:#c9a227}
.media-thumb.video{position:relative}
.media-thumb.video::after{content:'▶';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:20px}
</style>
</head>
<body>
<div id="toolbar">
  <button id="add-media-btn">📎 Add Media</button>
  <button id="save-btn" class="primary">💾 Save Layout</button>
  <button id="clear-btn">🗑 Clear All</button>
  <span class="badge" id="tile-count">0 tiles</span>
  <span class="spacer"></span>
  <span id="zoom-level">100%</span>
</div>

<div id="canvas-container">
  <canvas id="canvas"></canvas>
</div>

<div class="controls">
  <button id="zoom-in">🔍+</button>
  <button id="zoom-out">🔍−</button>
  <button id="zoom-reset">⟲ Reset</button>
  <input type="range" id="scale-slider" min="0.3" max="2" step="0.1" value="1">
</div>

<div id="media-panel">
  <h3>Media Library</h3>
  <div id="media-list"></div>
</div>

<script src="quilt-layout.js"></script>
</body>
</html>
